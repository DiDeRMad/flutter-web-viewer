<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Epic Battle Arena - Multiplayer online battle arena game with real-time combat and strategy elements" />
  <meta name="keywords" content="game, multiplayer, battle arena, real-time, pvp, mmorpg, strategy" />
  <meta name="author" content="Epic Games Studio" />
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Epic Battle Arena" />
  <meta property="og:description" content="Join epic multiplayer battles in real-time! Choose your class, master your skills, and dominate the arena." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://epic-battle-arena.com" />
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  
  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Epic Battle Arena" />
  <meta name="twitter:description" content="Join epic multiplayer battles in real-time! Choose your class, master your skills, and dominate the arena." />
  <meta name="twitter:image" content="/og-image.jpg" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1976d2" />
  <meta name="background-color" content="#000000" />
  <meta name="display" content="standalone" />
  <meta name="orientation" content="landscape-primary" />
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Epic Battle Arena" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Critical CSS - Game fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Preload critical game assets -->
  <link rel="preload" href="/sounds/ui-click.mp3" as="audio" />
  <link rel="preload" href="/sounds/background-music.mp3" as="audio" />
  <link rel="preload" href="/images/game-logo.webp" as="image" />
  
  <title>Epic Battle Arena - Multiplayer Battle Game</title>
  
  <!-- Game Loading Styles -->
  <style>
    /* Critical CSS for loading screen */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Exo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
      color: #ffffff;
      overflow: hidden;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0f23, #1a1a2e, #16213e);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    
    .game-logo {
      font-family: 'Orbitron', monospace;
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 3s ease-in-out infinite;
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #4ecdc4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1.5rem;
    }
    
    .loading-text {
      font-size: 1.2rem;
      color: #a0a0a0;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-progress {
      width: 300px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    
    .loading-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4ecdc4, #45b7d1);
      border-radius: 2px;
      animation: progress 3s ease-in-out infinite;
    }
    
    .loading-tips {
      font-size: 0.9rem;
      color: #8a8a8a;
      text-align: center;
      max-width: 400px;
      line-height: 1.4;
    }
    
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @keyframes progress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Responsive design */
    @media (max-width: 768px) {
      .game-logo {
        font-size: 2.5rem;
      }
      
      .loading-progress {
        width: 250px;
      }
    }
  </style>
</head>
<body>
  <!-- Game Loading Screen -->
  <div id="loading-screen">
    <div class="game-logo">EPIC BATTLE ARENA</div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Initializing Game Engine...</div>
    <div class="loading-progress">
      <div class="loading-progress-bar"></div>
    </div>
    <div class="loading-tips">
      💡 Tip: Use WASD to move, mouse to aim, and spacebar to jump!
    </div>
  </div>
  
  <!-- React App Root -->
  <div id="root"></div>
  
  <!-- Loading Script -->
  <script>
    // Update loading text dynamically
    const loadingText = document.querySelector('.loading-text');
    const loadingTips = document.querySelector('.loading-tips');
    
    const loadingMessages = [
      'Initializing Game Engine...',
      'Loading Game Assets...',
      'Connecting to Servers...',
      'Preparing Battle Arena...',
      'Almost Ready for Battle!'
    ];
    
    const gameTips = [
      '💡 Tip: Use WASD to move, mouse to aim, and spacebar to jump!',
      '⚔️ Tip: Each character class has unique abilities - experiment!',
      '🛡️ Tip: Collect armor and weapons to boost your power!',
      '🎯 Tip: Team up with friends for better coordination!',
      '🏆 Tip: Complete achievements to unlock rewards!'
    ];
    
    let messageIndex = 0;
    
    const updateLoadingMessage = () => {
      if (messageIndex < loadingMessages.length) {
        loadingText.textContent = loadingMessages[messageIndex];
        loadingTips.textContent = gameTips[messageIndex];
        messageIndex++;
      }
    };
    
    // Update every 800ms
    const loadingInterval = setInterval(updateLoadingMessage, 800);
    
    // Hide loading screen when React app is ready
    window.hideLoadingScreen = () => {
      clearInterval(loadingInterval);
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.classList.add('hidden');
      setTimeout(() => {
        loadingScreen.style.display = 'none';
      }, 500);
    };
    
    // Error handling for loading failures
    window.addEventListener('error', (event) => {
      console.error('Loading error:', event.error);
      loadingText.textContent = 'Loading Error - Please Refresh';
      loadingText.style.color = '#ff6b6b';
    });
    
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
  
  <!-- React App Script -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Analytics (placeholder) -->
  <script>
    // Game analytics initialization
    window.gameAnalytics = {
      initialized: false,
      events: [],
      track: function(event, data) {
        if (!this.initialized) {
          this.events.push({ event, data, timestamp: Date.now() });
          return;
        }
        // Send to analytics service
        console.log('Analytics:', event, data);
      }
    };
  </script>
</body>
</html>
