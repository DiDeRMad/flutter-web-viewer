version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eba-postgres
    environment:
      POSTGRES_DB: epic_battle_arena
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - eba-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user -d epic_battle_arena"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: eba-redis
    command: redis-server --appendonly yes --requirepass redis_password_123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - eba-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Game Server Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: eba-server
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: epic_battle_arena
      DB_USER: game_user
      DB_PASSWORD: secure_password_123
      DB_SSL: false
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password_123
      REDIS_DB: 0
      
      # JWT
      JWT_SECRET: super_secure_jwt_secret_key_production_change_this
      JWT_EXPIRE: 7d
      JWT_REFRESH_SECRET: super_secure_refresh_secret_production
      JWT_REFRESH_EXPIRE: 30d
      
      # Security
      BCRYPT_ROUNDS: 12
      RATE_LIMIT_WINDOW: 15
      RATE_LIMIT_MAX_REQUESTS: 100
      
      # Game Settings
      MAX_PLAYERS_PER_MATCH: 100
      MATCH_DURATION: 600
      LOBBY_TIMEOUT: 30
      TICK_RATE: 60
      
      # Analytics
      ANALYTICS_ENABLED: true
      LOG_LEVEL: info
      LOG_RETENTION_DAYS: 30
      
      # Anti-cheat
      ANTI_CHEAT_ENABLED: true
      MAX_MOVEMENT_SPEED: 500
      MAX_ACTIONS_PER_SECOND: 10
      
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Game Client Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: eba-client
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:5000/api
      VITE_WS_URL: ws://localhost:5000
      VITE_APP_VERSION: 1.0.0
      VITE_APP_NAME: Epic Battle Arena
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - eba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: eba-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/ssl/certs:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - client
    restart: unless-stopped
    networks:
      - eba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: eba-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - eba-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: eba-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin_password_123
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - eba-network

  # Log Aggregation - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: eba-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - eba-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Log Aggregation - Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: eba-logstash
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/var/log/app:ro
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eba-network

  # Log Visualization - Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: eba-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eba-network

  # Game Analytics & Metrics
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: eba-analytics
    environment:
      DATABASE_URL: postgresql://game_user:secure_password_123@postgres:5432/epic_battle_arena
      REDIS_URL: redis://:redis_password_123@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eba-network

  # Background Jobs & Task Queue
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: worker
    container_name: eba-worker
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: epic_battle_arena
      DB_USER: game_user
      DB_PASSWORD: secure_password_123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password_123
      REDIS_DB: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eba-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  eba-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16